services:
  - type: web
    name: linkedin-post-automation
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    disk:
      name: reviews-db
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/reviews.db
      - key: NOTION_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BLOTATO_API_KEY
        sync: false
      - key: BLOTATO_LINKEDIN_ACCOUNT_ID
        sync: false
      - key: BASE_URL
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: BRAND_KNOWLEDGE
        sync: false
      # Second Notion source (GEFCO) — posts to the GEFCO LinkedIn Company Page
      - key: SOURCE_LABEL_2
        value: GEFCO
      - key: NOTION_DB_ID_2
        value: 772663a4-7b37-820a-aaf2-818b05d7aa3b
      - key: NOTION_READY_STATUS_2
        sync: false
      - key: NOTION_POSTED_STATUS_2
        sync: false
      - key: NOTION_STATUS_PROP_2
        sync: false
      - key: NOTION_STATUS_TYPE_2
        sync: false
      - key: NOTION_POSTED_DATE_PROP_2
        sync: false
      - key: BLOTATO_LINKEDIN_ACCOUNT_ID_2
        value: "11255"
      - key: BLOTATO_LINKEDIN_PAGE_ID_2
        value: "98984707"
      - key: BRAND_KNOWLEDGE_2
        sync: false
      - key: SCHEDULE_HOUR
        value: "9"
      - key: SCHEDULE_MINUTE
        value: "30"
